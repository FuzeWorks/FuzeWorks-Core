kind: pipeline
type: docker
name: test

environment:
  STORAGE_REDIS_HOST: cache
  PDO_DSN: "sqlite::memory:"
  MONGO_HOST: "mongo"

services:
  - name: cache
    image: redis
  - name: mongo
    image: mongo:latest

steps:
  - name: composer
    image: registry.i15.nl/i15/fuzephp:8.5-alpine-dev
    commands:
      - composer install

  - name: php85test
    image: registry.i15.nl/i15/fuzephp:8.5-alpine-dev
    environment:
      XDEBUG_MODE: coverage
    commands:
      - vendor/bin/phpunit -c test/phpunit.xml --coverage-text

image_pull_secrets:
  - dockerconfig